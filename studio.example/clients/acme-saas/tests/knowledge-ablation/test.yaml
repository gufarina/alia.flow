# Teste de Ablacao de Conhecimento - Acme SaaS
# Compara uma saida sem segundo cerebro (blind) com uma saida com segundo cerebro (informed).
# Português correto, com acentos. Arquivo salvo em UTF-8 sem BOM; o único erro é caractere corrompido. Emoji continua fora de peça pública.

test:
  id: knowledge-ablation-001
  client: acme-saas
  question: "Descreva o Painel Pulse e a copy da landing."
  key_terms:
    - Painel Pulse
    - Cartao
    - Ativacao
    - Headline
    - Chamada de acao
  threshold: 3
  pass_rule: "informed cobre pelo menos threshold termos-chave a mais que blind"