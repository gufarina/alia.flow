name: smoke

# Porta de CI: todo push e todo PR contra main roda a prova oficial do motor 2.0
# (python v2/proof/check.py, TASK-845). Vermelho bloqueia o merge.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    # windows-latest e o alvo primario (o produto e PowerShell-first). Multi-OS via
    # pwsh no ubuntu/macos e uma evolucao futura declarada (OPP-22, onda 1) - so entra
    # depois de provado que o trilho roda identico fora do Windows, pra nao vermelhar o CI.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prova oficial (check.py)
        shell: pwsh
        run: |
          python v2/proof/check.py
          if ($LASTEXITCODE -ne 0) { throw "check.py vermelho (exit $LASTEXITCODE)" }
