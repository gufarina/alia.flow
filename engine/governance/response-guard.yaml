# Alia Flow - Response Guard (M1: o freio, contrato estruturado)
# Configuracao lida por scripts/response-guard.ps1 (hook de Stop). Prosa/doutrina completa em
# response-guard.md. Sem acentos, sem emojis. UTF-8 sem BOM.
#
# A VALVULA (excecao legitima da REGRA 1, 09/08/2026) NAO mora neste arquivo de proposito: ela e
# ativada por linguagem natural do Operator no proprio pedido, nunca por configuracao (o Operator
# nao edita YAML). Doutrina completa em response-guard.md, secao "A VALVULA".

# mode controla o que o guard FAZ quando acha violacao numa das 2 regras (DELEGA, GROUNDING):
#   aviso    - NUNCA bloqueia. Sempre exit 0. So registra no log (studio/response-guard-log.jsonl)
#              e imprime um resumo de uma linha no stdout do hook. Este era o modo de nascimento
#              (rampa): mede aderencia sem travar a instancia viva.
#   bloqueio - havendo violacao, devolve {"decision":"block","reason":"..."} no stdout do hook,
#              pedindo o conserto antes de fechar o turno. Sem violacao, exit 0 silencioso.
#
# CONSERTO (auditoria forense, defeito 7, 09/08/2026): o modo ficou em "aviso" desde 03/08 com a
# promessa de virar "bloqueio" apos uma semana de log - passou mais de uma semana e nenhum dos 10
# mecanismos nascidos em aviso neste motor virou bloqueio (ninguem promove sozinho). Antes de virar,
# calibrei os limiares contra o log real (studio/response-guard-log.jsonl, 94 turnos gravados ate
# 09/08/2026, apos o conserto do defeito 6 que ampliou o campo de visao da REGRA 1 para alem de
# clients/):
#   REGRA 2 (GROUNDING): 6 de 94 turnos (6,4%) violaram com min_claims=3 - taxa baixa, o limiar de
#     3 afirmacoes nao esta gerando ruido excessivo. Mantido em 3.
#   REGRA 1 (DELEGA): 0 violacoes nos 94 turnos, mas o campo de visao amplo (item acima) so entrou
#     em vigor NESTA MESMA correcao - a maior parte do log foi gravada com o campo de visao antigo
#     (so clients/), entao a taxa de violacao sob o campo amplo ainda NAO tem historico proprio.
#     Vira bloqueio mesmo assim (e o que a lei pede), mas e divida assumida: se aparecer falso-
#     positivo (ex.: turno legitimo do proprio Alia Flow trabalhando em scripts/ ou engine/ sem
#     Task por ordem explicita do operador), o log deste modo bloqueio e a evidencia para recalibrar
#     ou reabrir excecao - reveja studio/response-guard-log.jsonl apos alguns dias em bloqueio.
mode: bloqueio

# REGRA 2 (GROUNDING) - quantidade minima de "afirmacoes de peso" (referencia a arquivo por
# extensao conhecida, ou padrao arquivo:linha) no texto da ULTIMA mensagem do assistente para a
# regra comecar a exigir um rotulo de proveniencia ([MEDIDO], [INFERIDO] ou [LIDO]) em algum
# ponto do texto. Abaixo deste teto, a regra nao se aplica (texto curto nao precisa rotular).
# Calibrado contra o log real: 6/94 turnos (6,4%) bateram este limiar sem rotulo.
min_claims: 3

# REGRA 1 (DELEGA) - limiar so INFORMATIVO, nunca reprova por si so. Quando a resposta final do
# turno passa deste tamanho (em caracteres) e o turno NAO chamou Agent/Task nenhuma vez, o guard
# registra isso no resumo do stdout (modo aviso) como sinal de possivel resposta grande demais
# sem delegacao - so para medir tendencia, nunca vira violacao sozinho.
min_chars_informativo: 1500
